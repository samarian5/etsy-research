<title>Etsy research</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // A truncated sign-in link can land on a deeper path. The fragment (and any
  // session it carries) survives a client-side redirect, so forward it to the board.
  var rest = location.pathname.replace(/^\/etsy-research\/?/, '');
  location.replace('/etsy-research/' + (rest ? '' : '') + location.search + location.hash);
</script>
