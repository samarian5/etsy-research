name: scrape

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Search phrase, e.g. t-shirt"
        required: true
      depth:
        description: "Pages to walk (1-100). Ceiling, not a promise."
        required: false
        default: "20"
  # Optional weekly refresh — enable once the first manual runs look clean.
  # schedule:
  #   - cron: "17 3 * * 1"

concurrency:
  group: etsy-crawl          # single-flight: never two crawls at once (ADR 0001)
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # under GHA's 6h cap, with room to abort cleanly
    env:
      PYTHONUNBUFFERED: "1"
      PROFILE_DIR: ${{ github.workspace }}/.etsy-profile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (xvfb + chrome presence check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome missing; installing Chrome for Testing"
            npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          fi
          (command -v google-chrome && google-chrome --version) || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-crawler.txt

      - name: Verify CDP stack
        run: |
          python -c "import seleniumbase, sb_cdp" 2>/dev/null || python -c "import seleniumbase; from seleniumbase import sb_cdp; print('seleniumbase', seleniumbase.__version__)"

      - name: Unit tests (parsers)
        run: python -m unittest discover -s tests -v

      # ── warm profile: restore last known-good, save only on success (ADR 0002) ──
      - name: Restore Chrome profile cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROFILE_DIR }}
          key: etsy-profile-v1-${{ github.run_id }}
          restore-keys: |
            etsy-profile-v1-

      - name: Crawl
        run: |
          CHROME_BIN="$(command -v google-chrome || find "$RUNNER_TEMP/chrome" -name chrome -type f | head -1)"
          echo "chrome: $CHROME_BIN"
          mkdir -p out
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python crawler/etsy_crawl.py \
              --keyword "${{ inputs.keyword }}" \
              --depth "${{ inputs.depth }}" \
              --run-id "${{ github.run_id }}" \
              --out out \
              --user-data-dir "$PROFILE_DIR" \
              --browser-executable-path "$CHROME_BIN"

      - name: Prune profile before caching
        if: success()
        run: |
          rm -rf "$PROFILE_DIR/Default/Cache" "$PROFILE_DIR/Default/Code Cache" \
                 "$PROFILE_DIR/Default/GPUCache" "$PROFILE_DIR/Default/Service Worker" || true
          du -sh "$PROFILE_DIR" || true

      - name: Save Chrome profile cache (only after a clean run)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROFILE_DIR }}
          key: etsy-profile-v1-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etsy-run-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/results.jsonl
            out/run.json
            out/payloads/
            out/html/
