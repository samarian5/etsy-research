name: scrape

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'JSON queue {"items":[{"keyword":"tshirt","depth":20}],"pages_per_run":8} — empty reads queue.sealed from the repo'
        required: false
        default: ""
      fast:
        description: "true = tighter waits (still >=0.6s between page loads)"
        required: false
        default: "true"
      profile:
        description: "warm = reuse cached Chrome profile; cold = start clean after a block"
        required: false
        default: "warm"
  # Refresh every second day, unattended, whether or not this laptop is on.
  # The queue travels as `queue.sealed` committed in the repo (scripts/publish_queue.py)
  # so the keyword list is never in the public tree; a dispatch input overrides it.
  # 04:10 UTC = early morning US / late morning EU: off-peak for Etsy's busiest pages.
  schedule:
    - cron: "10 4 */2 * *"

permissions:
  contents: read
  actions: write            # required to chain the next chunk

concurrency:
  group: etsy-crawl         # single-flight: never two crawls at once (ADR 0001)
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # a 3-page chunk takes ~20 min; anything longer is stuck
    env:
      PYTHONUNBUFFERED: "1"
      PROFILE_DIR: ${{ github.workspace }}/.etsy-profile
      # This repository is public (free unlimited Actions minutes), so the queue —
      # which names the keywords being researched — arrives sealed and the results
      # leave sealed. Both use ETSY_ARTIFACT_KEY, which never appears in a log.
      QUEUE_IN: ${{ inputs.queue }}
      ETSY_ARTIFACT_KEY: ${{ secrets.ETSY_ARTIFACT_KEY }}
      REDACT_KEYWORDS: "1"    # public repo: logs show kw-<hash>, not the keyword
      FAST: ${{ inputs.fast || 'true' }}
      PROFILE_MODE: ${{ inputs.profile || 'warm' }}
      COOLDOWN_SECONDS: "300"   # breathe between chunks: a flagged IP needs the gap
      STALL_MINUTES: "10"       # no progress for this long => dump stacks and exit
      NAV_TIMEOUT: "90"         # per-page-load deadline (see navigate())
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Open the queue
        run: |
          if [ -z "${ETSY_ARTIFACT_KEY}" ]; then
            echo "::error::ETSY_ARTIFACT_KEY secret is missing — refusing to run unsealed"
            exit 1
          fi
          python - <<'EOF'
          import os, json, sys
          sys.path.insert(0, "crawler")
          import artifact_crypt as ac
          raw = os.environ.get("QUEUE_IN") or ""
          source = "dispatch input"
          if not raw.strip() and os.path.exists("queue.sealed"):
              raw = open("queue.sealed").read()
              source = "queue.sealed (scheduled run)"
          if not raw.strip():
              print("::error::no queue: pass a dispatch input or commit queue.sealed")
              raise SystemExit(1)
          queue = ac.unseal(raw) if ac.is_sealed(raw) else raw
          json.loads(queue)  # fail loudly on a corrupt payload
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("QUEUE=%s\n" % queue.replace("\n", " "))
          print("queue opened from %s: %d item(s), %s, pages/run %s" % (
              source, len(json.loads(queue).get("items") or []),
              "sealed" if ac.is_sealed(raw) else "plaintext",
              json.loads(queue).get("pages_per_run")))
          EOF

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (xvfb + chrome presence check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome missing; installing Chrome for Testing"
            npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"
          fi
          (command -v google-chrome && google-chrome --version) || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-crawler.txt

      - name: Verify CDP stack
        run: python -c "import seleniumbase; from seleniumbase import sb_cdp; print('seleniumbase', seleniumbase.__version__)"

      - name: Unit tests (parsers + captured live page)
        run: python -m unittest discover -s tests -v

      # ── warm profile: restore last known-good, save only after a clean run ──
      - name: Restore Chrome profile cache
        if: (inputs.profile || 'warm') != 'cold'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROFILE_DIR }}
          key: etsy-profile-v1-${{ github.run_id }}
          restore-keys: |
            etsy-profile-v1-

      - name: Egress identity
        # Logged so a chunk's outcome can be correlated with the IP it ran from.
        # Standard GitHub runners get a fresh address per VM out of a pool shared
        # with every other Azure customer, so a bad-neighbour IP shows up as a
        # challenge storm — and only this line tells you it was the IP's fault.
        run: |
          IP=$(curl -s --max-time 15 https://api.ipify.org || echo unknown)
          echo "egress_ip=$IP"
          echo "EGRESS_IP=$IP" >> "$GITHUB_ENV"

      - name: Crawl one chunk
        run: |
          CHROME_BIN="$(command -v google-chrome || find "$RUNNER_TEMP/chrome" -name chrome -type f | head -1)"
          echo "chrome: $CHROME_BIN"
          export BROWSER_BIN="$CHROME_BIN"
          mkdir -p out
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python crawler/run_chunk.py

      - name: Prune profile before caching
        if: success()
        run: |
          rm -rf "$PROFILE_DIR/Default/Cache" "$PROFILE_DIR/Default/Code Cache" \
                 "$PROFILE_DIR/Default/GPUCache" "$PROFILE_DIR/Default/Service Worker" || true
          du -sh "$PROFILE_DIR" || true

      - name: Decide whether this profile is safe to cache
        id: clean
        if: success()
        run: |
          python - <<'EOF'
          import json, os
          try:
              meta = json.load(open("out/run.json"))
          except Exception:
              meta = {}
          clean = meta.get("status") == "succeeded" and int(meta.get("challenges") or 0) == 0
          print("status:", meta.get("status"), "| challenges:", meta.get("challenges"),
                "| cacheable:", clean)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("clean=%s\n" % ("true" if clean else "false"))
          EOF

      - name: Save Chrome profile cache (only after a challenge-free run)
        if: success() && steps.clean.outputs.clean == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROFILE_DIR }}
          key: etsy-profile-v1-${{ github.run_id }}

      - name: Seal the results
        if: always()
        run: |
          python - <<'EOF'
          import os, sys, tarfile, hashlib
          sys.path.insert(0, "crawler")
          import artifact_crypt as ac
          if not os.path.isdir("out"):
              print("no out/ directory — nothing to seal")
              raise SystemExit(0)
          with tarfile.open("out.tar.gz", "w:gz") as tf:
              tf.add("out", arcname="")
          before = os.path.getsize("out.tar.gz")
          ac.seal_file("out.tar.gz", "out.tar.gz.enc")
          os.remove("out.tar.gz")
          print("sealed artifact: %d bytes plaintext -> %d bytes ciphertext"
                % (before, os.path.getsize("out.tar.gz.enc")))
          EOF

      - name: Upload results (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etsy-run-${{ github.run_id }}
          retention-days: 3          # public repo: keep the window short
          if-no-files-found: warn
          path: out.tar.gz.enc

      # ── the chain: keep working until the queue is empty or a chunk fails ──
      - name: Choose the cooldown
        id: cool
        if: always() && !cancelled()
        # A retry after a block waits longer: the point is to land on a different
        # runner IP *and* let the flagged session go cold, not to retry in place.
        run: |
          if [ ! -f out/next_queue.json ]; then
            echo "seconds=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SECS=$(python -c "import json;q=json.load(open('out/next_queue.json'));a=max([int(i.get('attempts') or 0) for i in (q.get('items') or [{}])] or [0]);print(900 if a>=1 else 300)")
          echo "seconds=$SECS" >> "$GITHUB_OUTPUT"
          echo "next chunk waits ${SECS}s"

      - name: Cool down before chaining
        # A chunk that stopped on a block exits non-zero *on purpose*; the queue's
        # cold-profile retry only happens if this step still runs. Measured
        # 2026-11-04 (run 41760485370): success() here silently killed the chain.
        if: always() && !cancelled()
        run: sleep "${{ steps.cool.outputs.seconds }}"

      - name: Dispatch next chunk
        if: always() && !cancelled()
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          path = "out/next_queue.json"
          if not os.path.exists(path):
              print("nothing to dispatch — chain finished")
              raise SystemExit(0)
          queue = json.load(open(path))
          if not queue.get("items"):
              print("queue empty — chain finished")
              raise SystemExit(0)
          import sys as _sys
          _sys.path.insert(0, "crawler")
          import artifact_crypt as ac
          sealed = ac.seal(json.dumps(queue))
          body = json.dumps({
              "ref": "main",
              "inputs": {
                  "queue": sealed,
                  "fast": os.environ.get("FAST", "true"),
                  "profile": queue.get("profile") or os.environ.get("PROFILE_MODE", "warm"),
              },
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/scrape.yml/dispatches",
              data=body, method="POST",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "User-Agent": "etsy-chain"})
          with urllib.request.urlopen(req, timeout=30):
              pass
          pages = [i.get("page", 1) for i in queue["items"]]
          print("dispatched next chunk: %d item(s), starting page(s) %s, %d bytes sealed"
                % (len(queue["items"]), pages[:6], len(sealed)))
          EOF
